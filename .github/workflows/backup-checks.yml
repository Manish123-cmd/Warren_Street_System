name: Check weekly backup tooling

on:
  push:
    branches: [main]
    paths: ['backups/**', 'tests/backups/**', '.github/workflows/*backup*.yml']
  pull_request:
    paths: ['backups/**', 'tests/backups/**', '.github/workflows/*backup*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backups/requirements*.txt
      - run: python -m pip install -r backups/requirements-dev.txt
      - run: python -m unittest discover -s tests/backups -v
