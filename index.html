<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Qima Cafe Warren Street — website coming soon.">
    <title>Qima Cafe Warren Street</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f1e8; color: #34251d; font-family: Georgia, serif; }
      main { width: 100%; max-width: 720px; text-align: center; padding: 64px 24px; }
      .eyebrow { font: 12px/1.5 Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; }
      h1 { font-size: clamp(40px, 9vw, 80px); font-weight: 400; line-height: 1.1; margin: 24px 0; }
      p { font-size: 20px; line-height: 1.6; }
      .status { display: inline-block; margin-top: 24px; border: 1px solid #86715d; padding: 10px 20px; border-radius: 24px; font: 14px/1.5 Arial, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Warren Street</p>
      <h1>Qima Cafe</h1>
      <p>Our website is coming soon.</p>
      <span class="status">Something new is brewing</span>
    </main>
  </body>
</html>
